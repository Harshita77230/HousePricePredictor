<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 House Price Predictor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      color: #1f2328;
    }

    /* ── Header ───────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header .icon { font-size: 3rem; line-height: 1; }
    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-top: .4rem;
      color: #1f2328;
    }
    header p {
      margin-top: .4rem;
      color: #57606a;
      font-size: .95rem;
    }
    .model-badge {
      display: inline-block;
      margin-top: .6rem;
      background: #e0e7ff;
      color: #3730a3;
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .75rem;
      border-radius: 999px;
      letter-spacing: .02em;
    }

    /* ── Card ─────────────────────────────────────── */
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      padding: 2rem 2rem 1.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    /* ── Form ─────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
    }
    .form-group { display: flex; flex-direction: column; gap: .35rem; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: .8rem;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    label span { font-weight: 400; color: #9ca3af; text-transform: none; }

    input[type="number"], select {
      width: 100%;
      padding: .55rem .75rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: .95rem;
      color: #1f2328;
      background: #f9fafb;
      transition: border-color .15s, box-shadow .15s;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #3b82d4;
      box-shadow: 0 0 0 3px rgba(59,130,212,.15);
      background: #fff;
    }

    /* custom select arrow */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: .85rem;
    }
    .select-wrap select { padding-right: 2.2rem; }

    /* ── Button ───────────────────────────────────── */
    .btn-predict {
      margin-top: 1.5rem;
      width: 100%;
      padding: .8rem;
      background: #3b82d4;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      letter-spacing: .02em;
    }
    .btn-predict:hover  { background: #2563eb; }
    .btn-predict:active { transform: scale(.98); }
    .btn-predict:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── Result box ───────────────────────────────── */
    #result {
      margin-top: 1.6rem;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .result-header {
      padding: 1rem 1.25rem .75rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .result-header .price-label {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      opacity: .75;
    }
    .result-header .price-value {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .category-pill {
      margin-left: auto;
      padding: .3rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      background: rgba(255,255,255,.25);
      white-space: nowrap;
    }

    .result-details {
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: .9rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .5rem .75rem;
    }
    .detail-item { display: flex; flex-direction: column; gap: .1rem; }
    .detail-item .d-label { font-size: .7rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; }
    .detail-item .d-value { font-size: .88rem; color: #1f2328; font-weight: 600; }

    .result-footer {
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: .5rem 1.25rem;
      font-size: .75rem;
      color: #9ca3af;
    }

    /* ── Error ────────────────────────────────────── */
    .error-box {
      margin-top: 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .88rem;
      display: none;
    }

    /* ── Loading spinner ──────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
      .result-details { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="icon">🏠</div>
    <h1>House Price Predictor</h1>
    <p>Enter your house details to get an instant price estimate.</p>
    <span class="model-badge">🤖 Model: {{ model_name }}</span>
  </header>

  <div class="card">
    <form id="predictForm">
      <div class="form-grid">

        <div class="form-group full">
          <label>House Size <span>(sq ft)</span></label>
          <input type="number" id="size_sqft" min="500" max="10000" placeholder="e.g. 1500" required />
        </div>

        <div class="form-group">
          <label>Bedrooms</label>
          <input type="number" id="bedrooms" min="1" max="10" placeholder="e.g. 3" required />
        </div>

        <div class="form-group">
          <label>Bathrooms</label>
          <input type="number" id="bathrooms" min="1" max="8" placeholder="e.g. 2" required />
        </div>

        <div class="form-group">
          <label>House Age <span>(years)</span></label>
          <input type="number" id="age_years" min="0" max="100" placeholder="e.g. 10" required />
        </div>

        <div class="form-group">
          <label>Garage Spots</label>
          <input type="number" id="garage" min="0" max="5" placeholder="e.g. 1" required />
        </div>

        <div class="form-group full">
          <label>Location Type</label>
          <div class="select-wrap">
            <select id="location" required>
              <option value="" disabled selected>Select location…</option>
              <option value="urban">🏙️ Urban</option>
              <option value="suburban">🏘️ Suburban</option>
              <option value="rural">🌾 Rural</option>
            </select>
          </div>
        </div>

      </div><!-- /form-grid -->

      <button type="submit" class="btn-predict" id="submitBtn">
        Predict Price
      </button>
    </form>

    <div class="error-box" id="errorBox"></div>

    <!-- Result -->
    <div id="result">
      <div class="result-header" id="resultHeader">
        <div>
          <div class="price-label">Estimated Price</div>
          <div class="price-value" id="priceValue"></div>
        </div>
        <div class="category-pill" id="categoryPill"></div>
      </div>
      <div class="result-details">
        <div class="detail-item">
          <span class="d-label">Size</span>
          <span class="d-value" id="dSize"></span>
        </div>
        <div class="detail-item">
          <span class="d-label">Bedrooms</span>
          <span class="d-value" id="dBed"></span>
        </div>
        <div class="detail-item">
          <span class="d-label">Bathrooms</span>
          <span class="d-value" id="dBath"></span>
        </div>
        <div class="detail-item">
          <span class="d-label">Age</span>
          <span class="d-value" id="dAge"></span>
        </div>
        <div class="detail-item">
          <span class="d-label">Garage</span>
          <span class="d-value" id="dGarage"></span>
        </div>
        <div class="detail-item">
          <span class="d-label">Location</span>
          <span class="d-value" id="dLocation"></span>
        </div>
      </div>
      <div class="result-footer" id="resultFooter"></div>
    </div>

  </div><!-- /card -->

  <script>
    const form      = document.getElementById("predictForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox  = document.getElementById("errorBox");
    const result    = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      result.style.display   = "none";

      submitBtn.disabled   = true;
      submitBtn.innerHTML  = '<span class="spinner"></span>Predicting…';

      const payload = {
        size_sqft: document.getElementById("size_sqft").value,
        bedrooms:  document.getElementById("bedrooms").value,
        bathrooms: document.getElementById("bathrooms").value,
        age_years: document.getElementById("age_years").value,
        garage:    document.getElementById("garage").value,
        location:  document.getElementById("location").value,
      };

      try {
        const res  = await fetch("/predict", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Prediction failed.");
        }

        // Paint result header with category colour
        const header = document.getElementById("resultHeader");
        header.style.background = data.color;
        header.style.color      = "#fff";

        document.getElementById("priceValue").textContent   = data.formatted;
        document.getElementById("categoryPill").textContent = data.category;

        // Details
        document.getElementById("dSize").textContent     = Number(payload.size_sqft).toLocaleString() + " sq ft";
        document.getElementById("dBed").textContent      = payload.bedrooms;
        document.getElementById("dBath").textContent     = payload.bathrooms;
        document.getElementById("dAge").textContent      = payload.age_years + " yrs";
        document.getElementById("dGarage").textContent   = payload.garage + " spot" + (payload.garage == 1 ? "" : "s");
        document.getElementById("dLocation").textContent = payload.location.charAt(0).toUpperCase() + payload.location.slice(1);

        document.getElementById("resultFooter").textContent = "Model: " + data.model_name;

        result.style.display = "block";

      } catch (err) {
        errorBox.textContent      = "⚠️  " + err.message;
        errorBox.style.display    = "block";
      } finally {
        submitBtn.disabled  = false;
        submitBtn.innerHTML = "Predict Price";
      }
    });
  </script>

</body>
</html>
